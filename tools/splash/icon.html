<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<!-- Значок программы — тот же знак, что в заставке: пластинка с лаймовым
     кантом и наклейкой со стрелкой «играть». Каждый размер рисуется
     отдельно: на 16 точках канавки превращаются в кашу, их там нет.
     Результат уходит в tools/splash/receive.py, оттуда — pack_icon.py. -->
<canvas id="c"></canvas>
<script>
(async function () {
  const LIME = "#c8f751", INK = "#0d1204";
  const c = document.getElementById("c"), x = c.getContext("2d");
  const out = [];
  for (const s of [16, 20, 24, 32, 40, 48, 64, 128, 256]) {
    c.width = c.height = s;
    x.clearRect(0, 0, s, s);
    const cx = s / 2, cy = s / 2, R = s / 2 - Math.max(0.5, s * 0.02);
    const small = s <= 24;
    // винил
    const g = x.createRadialGradient(cx, cy, R * 0.2, cx, cy, R);
    g.addColorStop(0, "#20251a");
    g.addColorStop(1, "#050604");
    x.fillStyle = g;
    x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.fill();
    if (!small) {
      for (let i = 0; i < (s >= 128 ? 14 : 4); i++) {
        x.strokeStyle = `rgba(255,255,255,${s >= 128 ? 0.05 : 0.08})`;
        x.lineWidth = Math.max(0.6, s / 256);
        x.beginPath(); x.arc(cx, cy, R * (0.5 + i * (s >= 128 ? 0.032 : 0.1)), 0, Math.PI * 2); x.stroke();
      }
      // блик
      const cg = x.createConicGradient(-0.7, cx, cy);
      [[0, 0], [0.06, 0.22], [0.12, 0], [0.5, 0], [0.56, 0.14], [0.62, 0], [1, 0]].forEach(([p, a]) => cg.addColorStop(p, `rgba(220,255,170,${a})`));
      x.fillStyle = cg;
      x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.fill();
    }
    // кант
    x.strokeStyle = LIME;
    x.lineWidth = Math.max(1, s * (small ? 0.09 : 0.045));
    x.beginPath(); x.arc(cx, cy, R - x.lineWidth / 2, 0, Math.PI * 2); x.stroke();
    // наклейка
    const lr = R * (small ? 0.56 : 0.4);
    x.fillStyle = LIME;
    x.beginPath(); x.arc(cx, cy, lr, 0, Math.PI * 2); x.fill();
    // стрелка «играть»
    const t = lr * 0.52;
    x.fillStyle = INK;
    x.beginPath();
    x.moveTo(cx - t * 0.55, cy - t * 0.8);
    x.lineTo(cx + t * 0.85, cy);
    x.lineTo(cx - t * 0.55, cy + t * 0.8);
    x.closePath();
    x.fill();
    out.push(s + " " + c.toDataURL("image/png"));
  }
  await fetch("http://127.0.0.1:8765/out", { method: "POST", body: out.join("\n") });
  document.title = "done";
})();
</script>
</body>
</html>
