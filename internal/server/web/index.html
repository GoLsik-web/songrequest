<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заказ музыки</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<!-- Иконки вставляются сюда при загрузке: <use> на внешний файл
     Chrome не поддерживает, поэтому спрайт живёт прямо в странице. -->
<div id="sprite" hidden></div>

<div class="status-bar" id="bar"></div>

<!-- Код для входа в Twitch: пока он не введён, это самое важное на экране. -->
<div id="banner" hidden></div>

<section class="stage" id="stage"></section>

<div class="lower">
  <section class="queue">
    <div class="kicker">
      Очередь <span class="cnt" id="q-count">0</span>
      <span class="rest" id="q-rest"></span>
    </div>
    <div id="queue"></div>
  </section>

  <aside class="side">
    <div class="kicker">Хроника</div>
    <ul class="feed" id="feed"></ul>
  </aside>
</div>

<section class="panel" id="settings" hidden>
  <div class="kicker">Настройки</div>

  <div class="grid">
    <div>
      <label class="field">
        <span>Client ID Spotify — из инструкции, шаг 3</span>
        <input type="text" id="client-id" spellcheck="false" autocomplete="off"
               placeholder="набор букв и цифр">
      </label>
      <div class="acts" style="margin-top:0">
        <button class="act small" id="save-id">Сохранить</button>
        <button class="act small key" id="login">Подключить Spotify</button>
        <button class="act small risky" id="logout">Отключить</button>
      </div>

      <div class="account" id="account"></div>
      <div class="hint" id="redirect" style="font-size:12px;color:var(--dimmer);margin-top:10px"></div>
    </div>

    <div>
      <label class="field">
        <span>Client ID Twitch — из инструкции по Twitch</span>
        <input type="text" id="twitch-id" spellcheck="false" autocomplete="off"
               placeholder="набор букв и цифр">
      </label>
      <div class="acts" style="margin-top:0">
        <button class="act small" id="save-twitch-id">Сохранить</button>
        <button class="act small key" id="twitch-login">Подключить Twitch</button>
        <button class="act small risky" id="twitch-logout">Отключить</button>
      </div>
      <div class="account" id="twitch-account"></div>
    </div>

    <div>
      <span class="field" style="margin-bottom:8px"><span>Если вернуть музыку на место не вышло</span></span>
      <div class="modes" id="modes">
        <label class="mode">
          <input type="radio" name="resume" value="nothing">
          <span>
            <span class="name">Ничего не включать</span>
            <span class="why">Просто уведомление в панели. Тишина, пока не включишь сам.</span>
          </span>
        </label>
        <label class="mode">
          <input type="radio" name="resume" value="playlist">
          <span>
            <span class="name">Включить запасной плейлист</span>
            <span class="why">Самый предсказуемый вариант: заранее знаешь, что заиграет.</span>
          </span>
        </label>
        <label class="mode">
          <input type="radio" name="resume" value="radio">
          <span>
            <span class="name">Включить музыку последнего артиста</span>
            <span class="why">Ближе всего к тому, что играло. Настоящее радио Spotify через API недоступно, поэтому берём популярные треки этого артиста.</span>
          </span>
        </label>
      </div>

      <label class="field" style="margin-top:14px">
        <span>Запасной плейлист</span>
        <select id="playlist"><option value="">— не выбран —</option></select>
        <span class="hint" id="playlist-hint"></span>
      </label>
    </div>

    <div>
      <span class="field" style="margin-bottom:8px"><span>Диагностика</span></span>
      <label class="check">
        <input type="checkbox" id="debug-log">
        Подробный лог
      </label>
      <div class="hint" style="font-size:12px;color:var(--dimmer);margin-bottom:12px">
        Включи, повтори то, что не работало, и выгрузи лог. Ключи доступа
        и Client ID из архива вырезаются.
      </div>
      <div class="acts" style="margin-top:0">
        <a class="act small" id="diag" href="/api/diag/export">Выгрузить лог</a>
      </div>
    </div>
  </div>
</section>

<footer id="status" class="offline">Подключаюсь к приложению…</footer>
<script src="/static/app.js"></script>
</body>
</html>
