<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Виджет заказа музыки</title>
<style>
  /* Прозрачный фон обязателен: в OBS это Browser Source поверх картинки.
     Пока виджета нет, страница всё равно должна что-то говорить — открытая
     пустая вкладка выглядит как поломка. */
  html, body { margin: 0; background: transparent; }
  body {
    font: 15px/1.6 system-ui, "Segoe UI", sans-serif;
    color: #f2f4f5;
    background: #08090a;
    display: grid; place-items: center; min-height: 100vh;
    text-align: center;
  }
  div { max-width: 420px; padding: 0 24px; }
  b { display: block; font-size: 20px; margin-bottom: 10px; }
  p { color: #6f777e; margin: 0; }
  i { display: block; width: 40px; height: 2px; background: #282c30; margin: 0 auto 20px; }
</style>
</head>
<body>
<div>
  <i></i>
  <b>Виджет ещё не готов</b>
  <p>Здесь будет обложка, название трека и ник заказчика — то, что видят зрители.
     Добавлять эту страницу в OBS пока рано.</p>
</div>
</body>
</html>
