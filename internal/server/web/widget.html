<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Заказ музыки — виджет</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/widget.css">
<style>
/* Виджет для OBS. Прозрачный фон обязателен: это Browser Source поверх
   картинки. Здесь только сцена; всё оформление плашки живёт в widget.css,
   потому что тот же файл использует предпросмотр в панели — иначе панель
   показывала бы одно, а стрим другое. */

html, body { margin: 0; background: transparent; overflow: hidden; }
body { -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="art" id="art"></div>
  <div class="text">
    <div class="title" id="title"></div>
    <div class="artist" id="artist"></div>
    <div class="by" id="by"></div>
    <div class="bar"><i id="bar"></i></div>
  </div>
</div>

<script src="/static/widget-presets.js"></script>
<script>
// Виджет живёт на том же сокете, что и панель: отдельного опроса нет.
//
// Оформление тоже приезжает по сокету вместе с состоянием. Это осознанно:
// иначе каждая правка в панели означала бы «скопируй новый адрес и вставь
// его в OBS заново». Адрес один и навсегда, а вид меняется на лету.
(() => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const card = $("card");

  // Без `??`: OBS возит с собой свой браузер, и в старых сборках это не
  // «не поддерживается», а ошибка разбора — тогда не выполняется весь
  // скрипт виджета целиком, и в кадре остаётся пустой прозрачный
  // прямоугольник. Ни ошибки, ни следа в логе.
  const esc = (s) => String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));

  // Обложку берём не со склада Spotify напрямую, а у самого приложения.
  //
  // Браузер внутри OBS ходит в интернет сам по себе и про обход блокировок,
  // поднятый приложением, не знает: в панели обложка была видна, а в кадре —
  // нет. Приложение качает её через тот же обход и отдаёт со 127.0.0.1, а если
  // не смогло — переводит браузер на прямой адрес, как было раньше.
  const coverSrc = (u) => "/cover?u=" + encodeURIComponent(u);

  const NOTE = `<svg class="no" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`;

  // ── оформление ─────────────────────────────────────────────────────

  let applied = "";
  // Показывать ли ник заказчика. Строка под артистом есть всегда: она
  // отвечает на вопрос «это заказали или стример сам поставил», и без неё
  // зритель решит, что заказы заняты на полчаса вперёд.
  let showNick = true;

  function dress(w) {
    if (!w) return;

    // Сравниваем целиком: перерисовывать плашку на каждом обновлении
    // состояния нельзя — сбросится анимация и дрогнет картинка в кадре.
    const signature = JSON.stringify(w);
    if (signature === applied) return;
    applied = signature;

    // Настройки поменяли — забываем, что этот трек уже отвисел своё.
    // Иначе стример ставит «убирать через 15 секунд», плашка прячется, он
    // передумывает и ставит «не убирать» — а на текущем треке ничего не
    // происходит, и выглядит это как «настройка не работает».
    heldTrack = null;

    const { family, variant } = widgetPreset(w.preset);
    card.dataset.family = family.id;
    card.dataset.variant = variant.id;
    card.dataset.art = w.show_art === false ? "off" : "on";
    showNick = w.show_requester !== false;
    card.dataset.bar = w.show_bar === false ? "off" : "on";
    // Без этого галочка «Движение» работала только в предпросмотре панели,
    // а в OBS плашка продолжала дёргаться.
    card.dataset.motion = w.motion === false ? "off" : "on";

    card.style.setProperty("--scale", Number(w.scale) || 1);

    // Угол и отступ. У тикера своя геометрия: он занимает всю ширину, и
    // боковые отступы ему только мешают.
    const gap = (Number.isFinite(w.gap) ? w.gap : 40) + "px";
    const pos = w.position || "left-bottom";
    card.style.left = card.style.right = card.style.top = card.style.bottom = "";
    if (family.id !== "ticker") {
      card.style[pos.includes("left") ? "left" : "right"] = gap;
    }
    card.style[pos.includes("top") ? "top" : "bottom"] = family.id === "ticker" ? "0px" : gap;
    // Вход и уход идут от ближайшего края кадра, а не всегда слева: иначе
    // плашка пересекает весь кадр, чтобы встать в свой угол.
    card.dataset.pos = pos;

    // Ручная настройка поверх набора. Значения уже проверены приложением,
    // но список ключей сверяем и здесь: страница не должна зависеть от того,
    // что кто-то поправил config.json руками.
    const allowed = new Set(WIDGET_TWEAKS.map((t) => t.key));
    for (const t of WIDGET_TWEAKS) card.style.removeProperty(t.key);
    for (const [key, value] of Object.entries(w.tweaks || {})) {
      if (allowed.has(key)) card.style.setProperty(key, value);
    }
  }

  // ── трек ───────────────────────────────────────────────────────────

  let shownTrack = null;
  let progressTimer = null;
  let hideTimer = null;
  let holdTimer = null;
  let leaveTimer = null;
  // heldTrack — трек, который уже отвисел свои секунды и больше не всплывает.
  let heldTrack = null;
  let stateTimer = null;
  let swapTimer = null;

  // Появление, смена трека и уход — три разных состояния с разными
  // анимациями. Класс обязательно снимается после проигрыша: пока он висит,
  // его правила по специфичности глушат постоянные анимации — дыхание
  // неона, покачивание снимка, аберрацию импланта.
  const STATES = ["enter", "swap-out", "swap-in", "leave"];

  function play(kind) {
    clearTimeout(stateTimer);
    clearTimeout(leaveTimer);
    card.classList.remove(...STATES);
    void card.offsetWidth;      // без сброса анимация второй раз не сыграет
    card.classList.add("show", kind);
    if (kind !== "leave") {
      stateTimer = setTimeout(() => card.classList.remove(kind), 1600);
    }
  }

  // Смена трека идёт в две фазы: старое содержимое уходит, только потом
  // подменяется текст, и уже новое приходит. Одной фазой глаз успевает
  // заметить подмену до анимации — и вся она выглядит подделкой.
  //
  // Сколько длится уход, знает само оформление: у терминала это забой на
  // 240 мс, у полосы — 130. Держать это расписание вторым списком в коде
  // значило бы однажды разъехаться с ним.
  function swapTrack(fill) {
    const out = parseFloat(getComputedStyle(card).getPropertyValue("--swap-out")) || 150;
    play("swap-out");
    clearTimeout(swapTimer);
    swapTimer = setTimeout(() => {
      fill();
      play("swap-in");
    }, out);
  }

  function show(now, hold) {
    const key = now.title + "|" + now.artist + "|" + now.requester;
    // Уже показали и спрятали этот трек по таймеру — не показываем снова.
    // Иначе «убирать через 15 секунд» превращалось в мигающую плашку: любое
    // следующее состояние заводило показ заново.
    if (key === heldTrack) return;
    if (key !== shownTrack) {
      shownTrack = key;

      const fill = () => {
        card.dataset.source = now.source === "own" ? "own" : "order";
        $("title").textContent = now.title;
        $("artist").textContent = now.artist;
        $("by").textContent = byLine(now);
        $("art").innerHTML = now.cover_url ? `<img src="${esc(coverSrc(now.cover_url))}" alt="">` : NOTE;
      };

      // Плашка уже висела — значит трек просто сменился, заново выезжать
      // ей неоткуда: меняется содержимое, а не сама вещь.
      if (card.classList.contains("show")) {
        swapTrack(fill);
      } else {
        fill();
        play("enter");
      }

      // Показ на несколько секунд вместо постоянной плашки — отдельная
      // настройка: кому-то виджет нужен как объявление, а не как табло.
      clearTimeout(holdTimer);
      if (hold > 0) {
        holdTimer = setTimeout(() => {
          heldTrack = key;
          hide();
        }, hold * 1000);
      }
    }

    // Полосу двигаем сами: приложение присылает состояние только при
    // изменениях, а прогресс должен идти плавно.
    clearInterval(progressTimer);
    if (now.duration_ms > 0) {
      const started = Date.now() - now.position_ms;
      const tick = () => {
        const done = Math.min(1, (Date.now() - started) / now.duration_ms);
        $("bar").style.width = (done * 100) + "%";
        // Тем же числом живёт тонарм у винила: он ползёт к центру по
        // настоящему прогрессу, а не по отдельному таймеру.
        card.style.setProperty("--progress", done.toFixed(4));
      };
      tick();
      progressTimer = setInterval(tick, 1000);
    } else {
      // Длительность неизвестна (так бывает у заказов с YouTube). Полосу
      // надо обнулить, а не оставлять там, где её бросил прошлый трек:
      // иначе зритель видит «трек почти кончился» в самом его начале.
      $("bar").style.width = "0%";
      card.style.setProperty("--progress", "0");
    }
  }

  // Откуда трек — это отдельная мысль, и сказать её надо словами: цветом
  // или значком зритель не поймёт, а подписи «музыка канала» достаточно.
  function byLine(now) {
    if (now.source === "own") return "музыка канала";
    if (showNick && now.requester) return "заказал " + now.requester;
    return "заказ зрителя";
  }

  function hide() {
    clearInterval(progressTimer);
    clearTimeout(holdTimer);
    clearTimeout(swapTimer);
    shownTrack = null;
    if (!card.classList.contains("show")) return;

    // Уход тоже анимирован, поэтому прячем не сразу, а когда доиграет.
    play("leave");
    clearTimeout(leaveTimer);
    leaveTimer = setTimeout(() => {
      card.classList.remove("show", "leave");
    }, 340);
  }

  function render(state) {
    dress(state.widget);
    if (state.now) {
      show(state.now, state.widget ? state.widget.hold_seconds : 0);
      return;
    }
    // Музыка кончилась — забываем, что уже показывали.
    //
    // Без этого при включённом «убирать через N секунд» повторный заказ
    // того же трека тем же зрителем не показывался вовсе: ключ совпадал с
    // heldTrack, и show() выходил на первой же строке. Трек играет, виджет
    // молчит, и стример этого не замечает — у него в панели всё нормально.
    heldTrack = null;
    hide();
  }

  // ── демо ───────────────────────────────────────────────────────────

  // Выставить виджет в OBS иначе можно только во время настоящего заказа —
  // то есть уже на стриме, при зрителях. Показываем вымышленный трек, чтобы
  // позицию и размер проверяли заранее и спокойно.
  const demo = params.get("demo") === "1";

  function demoTrack(widget) {
    dress(widget);
    show({
      title: "Bohemian Rhapsody", artist: "Queen", requester: "zritel",
      source: "order", cover_url: "", duration_ms: 354000, position_ms: 149000,
    }, 0);
  }

  // ── связь ──────────────────────────────────────────────────────────

  let delay = 1000;

  function connect() {
    const socket = new WebSocket(`ws://${location.host}/ws`);

    socket.onopen = () => {
      delay = 1000;
      clearTimeout(hideTimer);
    };

    socket.onmessage = (e) => {
      const state = JSON.parse(e.data);
      // В демо-режиме настоящее состояние не должно стирать образец, но
      // оформление подхватывать надо: иначе в панели крутят настройки, а
      // предпросмотр в OBS остаётся прежним.
      if (demo) demoTrack(state.widget);
      else render(state);
    };

    socket.onclose = () => {
      // Приложение перезапустили или сеть моргнула — трек при этом играть не
      // перестал. Убирать плашку сразу значило бы мигать ею на стриме,
      // поэтому ждём: не вернулись за пять секунд — тогда прячем.
      if (!demo) {
        clearTimeout(hideTimer);
        hideTimer = setTimeout(hide, 5000);
      }
      // Виджет висит в OBS сутками: долбиться каждую секунду нельзя.
      setTimeout(connect, delay);
      delay = Math.min(delay * 2, 15000);
    };
  }

  connect();
})();
</script>
</body>
</html>
